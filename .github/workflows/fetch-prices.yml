name: Fetch Stock Prices

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 9:00 Beijing time
    - cron: '0 7 * * 1-5'   # 15:00 Beijing time
    - cron: '0 14 * * 1-5'  # 22:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance
      - name: Fetch Prices
        run: python scripts/fetch-prices.py
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add InvesThinking/data/stock-prices.json
          git commit -m "📈 Auto-update stock prices [skip ci]" || exit 0
          git push
